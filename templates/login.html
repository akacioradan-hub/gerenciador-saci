<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Controle de Clientes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border:1px solid #dbe3ec;border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.10)}h1{margin:0 0 8px;color:#0b1f33}p{color:#6b7a8c;margin:0 0 22px}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;color:#41566d;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:9px;font-size:15px}button{width:100%;border:0;background:#163a5f;color:#fff;padding:12px;border-radius:9px;font-weight:700;cursor:pointer}.erro{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:14px;font-size:14px}.nota{margin-top:16px;font-size:12px;color:#6b7a8c}
</style>
</head>
<body>
<div class="box">
  <h1>Controle de Clientes</h1>
  <p>Acesso ao sistema central.</p>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="post">
    <div class="field"><label>Usuário</label><input name="username" autocomplete="username" required></div>
    <div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
