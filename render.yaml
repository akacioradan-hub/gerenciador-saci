services:
  - type: web
    name: saci-clientes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saci-clientes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: saci-clientes-db
    plan: free
    databaseName: saci_clientes
    user: saci_clientes
